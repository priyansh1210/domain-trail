# Spec 010 tech §5.6, spec 012 §5.2, spec 015 §5.1 (FR-REF-010): retention, roll-ups, metrics, budgets, stale-data alert.
name: daily-cleanup

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Redo work already done today
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-cleanup
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run-job.yml
    with:
      job: cleanup
      force: ${{ inputs.force || false }}
    secrets: inherit
