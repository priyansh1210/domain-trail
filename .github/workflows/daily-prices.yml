# Spec 006 tech §5.6 (FR-REF-002): Porkbun prices + ECB currency rates daily; the site reads them from the database.
name: daily-prices

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Redo work already done today
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-refresh-prices
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run-job.yml
    with:
      job: refresh-prices
      force: ${{ inputs.force || false }}
    secrets: inherit
