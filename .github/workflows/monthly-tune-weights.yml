# Spec 008 tech §5.8 (FR-RANK-013, FR-REF-017): ranking-weight proposal from feedback; a person decides.
name: monthly-tune-weights

on:
  schedule:
    - cron: '0 6 2 * *'
  workflow_dispatch:
    inputs:
      force:
        description: Redo work already done today
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-tune-weights
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run-job.yml
    with:
      job: tune-weights
      force: ${{ inputs.force || false }}
      report: true
    secrets: inherit
