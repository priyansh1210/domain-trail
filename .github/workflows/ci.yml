# Spec 016 tech §1 (FR-QA-002): every change must pass these checks before merging to main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOCK_EXTERNALS: '1' # tests never call live services (FR-QA-003)
      PUBLIC_DATA_MODE: fixture # recorded DNS, RDAP, price and FX answers
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm trace:check
      - name: Scheduled jobs against fixtures and an in-process database (dry run)
        run: pnpm --filter @domains-all/jobs dry-run
      - name: Lint workflow files
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - run: pnpm build
      - name: Install the browser for end-to-end tests
        run: pnpm --filter @domains-all/web exec playwright install --with-deps chromium
      - name: End-to-end tests (mock mode, desktop + mobile, accessibility)
        run: pnpm --filter @domains-all/web test:e2e
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  db:
    # Applies every migration to a real local Supabase stack (complements the PGlite tests in packages/db).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (database + auth only)
        run: pnpm exec supabase start -x studio
      - name: Apply migrations from scratch
        run: pnpm exec supabase db reset
      - name: Lint database functions
        run: pnpm exec supabase db lint --level error
      - name: Schema matches migrations (no drift)
        run: |
          pnpm exec supabase db diff --schema public > drift.sql
          if [ -s drift.sql ]; then cat drift.sql; exit 1; fi
      - name: Scheduled jobs against this database with recorded sources (real driver, no internet)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          BACKUP_AGE_PUBLIC_KEY: age1qyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqs3290gq
          LOG_LEVEL: warn
        run: |
          for job in tld-registry refresh-prices nrd-ingest refresh-free-providers brand-list watchlist cleanup usage-report tune-weights; do
            pnpm job "$job" --fixtures --force
          done
