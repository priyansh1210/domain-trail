# Spec 007 / 010 (FR-REF-006): free-provider health and taken-name lists daily.
name: daily-free-providers

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Redo work already done today
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-refresh-free-providers
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run-job.yml
    with:
      job: refresh-free-providers
      force: ${{ inputs.force || false }}
    secrets: inherit
