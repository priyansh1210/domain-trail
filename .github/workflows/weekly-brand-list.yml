# Spec 010 tech §5.4 (FR-REF-007; R-12): Majestic Million top sites → brand check, every Sunday.
name: weekly-brand-list

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: Redo work already done today
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-brand-list
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run-job.yml
    with:
      job: brand-list
      force: ${{ inputs.force || false }}
    secrets: inherit
