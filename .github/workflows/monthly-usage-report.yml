# Spec 015 tech §5.4 (FR-OBS-008): last month's budgets, job success rates and search metrics to the owner.
name: monthly-usage-report

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: Redo work already done today
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-usage-report
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run-job.yml
    with:
      job: usage-report
      force: ${{ inputs.force || false }}
    secrets: inherit
